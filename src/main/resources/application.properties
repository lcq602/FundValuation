spring.application.name=FundValuation
server.port=5000
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- Refresh intervals ---
# Quote refresh: 15s during market hours, 5min outside market hours
quotes.refresh.fast-ms=15000
quotes.refresh.slow-ms=300000
# NAV refresh: 30min during market hours only (9-17 China time)
nav.refresh.interval-ms=1800000
# External fund JSON scan: reload and rebuild snapshot when data/funds changes
fund.data.scan.interval-ms=3600000
fund.data.scan.initial-delay-ms=60000
# News refresh: cache external rolling news in Redis once per hour
news.refresh.interval-ms=3600000
news.refresh.initial-delay-ms=5000

# Admin: writable fund data directory (for CRUD operations)
fund.data.dir=./data/funds
