<h2>选择你想要的现代化设计风格</h2>
<p class="subtitle">三种现代后台管理 UI 风格，你更倾向哪一种？</p>

<div class="cards">
  <div class="card" data-choice="glass" onclick="toggleSelect(this)">
    <div class="card-body">
      <h3>✨ 毛玻璃 / 轻量渐变</h3>
      <p>半透明毛玻璃效果，柔和渐变背景，圆润大圆角，感觉轻盈通透</p>
      <div style="margin-top: 8px; display: flex; gap: 4px;">
        <span style="background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px;">渐变紫</span>
        <span style="background: rgba(255,255,255,0.3); backdrop-filter: blur(10px); padding: 2px 8px; border-radius: 4px; font-size: 11px; border: 1px solid rgba(255,255,255,0.2);">毛玻璃卡片</span>
      </div>
    </div>
  </div>
  <div class="card" data-choice="clean" onclick="toggleSelect(this)">
    <div class="card-body">
      <h3>🎯 干净现代 / 极简专业</h3>
      <p>纯白背景+柔和灰，靛蓝强调色，清晰的信息层级，大留白，精致阴影 —偏专业金融风格</p>
      <div style="margin-top: 8px; display: flex; gap: 4px;">
        <span style="background: #6366f1; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px;">靛蓝 #6366f1</span>
        <span style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 2px 8px; border-radius: 4px; font-size: 11px;">白色卡片</span>
      </div>
    </div>
  </div>
  <div class="card" data-choice="dark" onclick="toggleSelect(this)">
    <div class="card-body">
      <h3>🌙 暗色系 / 高端质感</h3>
      <p>深色背景（slate/深蓝），亮色文字和强调色，适合长期使用的工具类后台，护眼且高级</p>
      <div style="margin-top: 8px; display: flex; gap: 4px;">
        <span style="background: #1e293b; color: #e2e8f0; padding: 2px 8px; border-radius: 4px; font-size: 11px; border: 1px solid #334155;">深色背景</span>
        <span style="background: #3b82f6; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px;">蓝色强调</span>
      </div>
    </div>
  </div>
</div>

<p class="subtitle" style="margin-top: 16px;">点击选中你喜欢的风格，然后在终端告诉我</p>
